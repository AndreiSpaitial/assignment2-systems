experiment_name: initial
train_path: data/tokenized/tinystories_train.npy
eval_path: data/tokenized/tinystories_valid.npy
results_path: cs336_systems/scripts/benchmark_results/initial
checkpoint_dir: cs336_basics/scripts/train/initial/checkpoints/
checkpoint_every: 1000
epochs: 1
eval_every: 1500
shuffle: True
batch_size: 4
max_steps: 10000


configs:
  small:
    gradient_clipping:
      M: 1

    lr_conf:
      lr_max: 1.0e-1
      lr_min: 1.0e-2
      t_W: 500
      t_C: 10000

    rope:
      theta: 10000

    transformer:
      d_model: 768
      num_heads: 12
      context_length: 256
      num_layers: 12
      d_ff: 3072

    tokenizer:
      checkpoint_dir: cs336_basics/tokenizer/checkpoints/tinystories/
      special_tokens: ["<|endoftext|>"]

    optimizer:
      lr: 1.0e-1
      weight_decay: 1.0e-2
      betas: [0.9, 0.999]
  
  medium:
